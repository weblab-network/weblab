name: Publish container images

on:
  push:
    branches: [main, feature/container-images]
    tags: ['v*']
    paths-ignore: ['site/**', 'docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
  SOURCE_REVISION: ${{ github.sha }}

concurrency:
  group: containers-${{ startsWith(github.ref, 'refs/tags/') && 'releases' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - name: Install test dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y perl qemu-system-x86 qemu-utils mtools tshark util-linux
      - name: Backend regression tests
        run: python3 -m unittest discover -s tests -v
      - name: MCP adapter integration tests
        run: |
          python3 -m venv /tmp/weblab-mcp-tests
          /tmp/weblab-mcp-tests/bin/pip install -r requirements-mcp.txt
          /tmp/weblab-mcp-tests/bin/python tests/mcp_smoke.py
      - name: Agent and workspace browser regression tests
        run: |
          npm ci --prefix tests
          npm exec --prefix tests -- playwright install --with-deps chromium
          node tests/agent_ui.cjs
          node tests/themes_ui.cjs
          node tests/workspace_layouts.cjs
          node tests/topology_multiselect.cjs
          node tests/map_controls.cjs
          node tests/internet_ui.cjs
          node tests/network_cloud_ui.cjs
          node tests/diagram_groups_ui.cjs
          node tests/instructions.cjs
          node tests/auth_ui.cjs
          node tests/auth_console_locks.cjs
          node tests/auth_agent.cjs
          node tests/shared_instructions.cjs
          node tests/activity.cjs
          node tests/console_open_mode.cjs
          node tests/workspace_features.cjs
          node tests/link_actions.cjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image version
        run: printf 'IMAGE_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=ci-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/feature/container-images' }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: weblab-smoke:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: python3 tools/smoke_container.py weblab-smoke:ci
      - name: Packaged traffic decoder and browser checks
        run: |
          docker run --rm --network none --hostname traffic-test \
            --add-host traffic-test:127.0.0.1 --entrypoint python3 \
            -v "$PWD/tests:/app/tests:ro" weblab-smoke:ci \
            -m unittest discover -s tests -p test_traffic_capture.py -v
          TRAFFIC_TEST_IMAGE=weblab-smoke:ci node tests/traffic_ui.cjs
      - name: Publish tested image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Verify staged runtime is the smoke-tested image
        run: |
          candidate=ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
          docker pull "$candidate"
          test "$(docker image inspect --format '{{.Id}}' weblab-smoke:ci)" = "$(docker image inspect --format '{{.Id}}' "$candidate")"

  exos-demo:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    needs: standard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - name: Download and verify the pinned EXOS release
        run: python3 tools/fetch_exos_demo_image.py packaging/exos/build
      - name: Validate the bundled topology
        run: python3 tools/validate_topology.py examples/exos-demo.json --image-dir packaging/exos/build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image version
        run: printf 'IMAGE_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-exos
          tags: |
            type=raw,value=ci-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/feature/container-images' }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
      - name: Build demo image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/exos/Dockerfile
          platforms: linux/amd64
          build-args: WEBLAB_IMAGE=ghcr.io/${{ github.repository }}@${{ needs.standard.outputs.digest }}
          load: true
          tags: weblab-exos-smoke:ci
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check packaged initialization and persistence
        run: python3 tools/smoke_exos_container.py weblab-exos-smoke:ci
      - name: Publish tested EXOS edition
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/exos/Dockerfile
          platforms: linux/amd64
          build-args: WEBLAB_IMAGE=ghcr.io/${{ github.repository }}@${{ needs.standard.outputs.digest }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Verify staged runtime is the smoke-tested image
        run: |
          candidate=ghcr.io/${{ github.repository }}-exos@${{ steps.publish.outputs.digest }}
          docker pull "$candidate"
          test "$(docker image inspect --format '{{.Id}}' weblab-exos-smoke:ci)" = "$(docker image inspect --format '{{.Id}}' "$candidate")"

  agent:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    needs: standard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image version
        run: printf 'IMAGE_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-agent
          tags: |
            type=raw,value=ci-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/feature/container-images' }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
      - name: Build companion for smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/agent/Dockerfile
          platforms: linux/amd64
          load: true
          tags: weblab-agent-smoke:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max
      - name: Check companion isolation, sessions and packaged tool transport
        env:
          WEBLAB_CORE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.standard.outputs.digest }}
        run: |
          docker pull "$WEBLAB_CORE_IMAGE"
          python3 tests/agent_packaging.py --core "$WEBLAB_CORE_IMAGE" --agent weblab-agent-smoke:ci
          python3 tests/agent_native.py --tool-gateway-only --image weblab-agent-smoke:ci
          python3 tests/agent_native.py --tool-gateway-only --internet-management --image weblab-agent-smoke:ci
      - name: Publish tested companion
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=agent
      - name: Verify staged runtime is the smoke-tested image
        run: |
          candidate=ghcr.io/${{ github.repository }}-agent@${{ steps.publish.outputs.digest }}
          docker pull "$candidate"
          test "$(docker image inspect --format '{{.Id}}' weblab-agent-smoke:ci)" = "$(docker image inspect --format '{{.Id}}' "$candidate")"

  internet:
    needs: standard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - name: Select helper identity
        run: |
          version=0.11.1-dev
          selector=sha-${SOURCE_REVISION}
          if [ "$RELEASE_BUILD" = true ]; then
            version=${RELEASE_TAG#v}
            selector=$version
          fi
          printf 'HELPER_VERSION=%s\nWL_INTERNET_IMAGE=ghcr.io/%s-internet:%s\n' \
            "$version" "$GITHUB_REPOSITORY" "$selector" >> "$GITHUB_ENV"
      - name: Build exact runtime sources and distribution image
        run: |
          docker build -f packaging/internet/Dockerfile.release --target sources \
            --build-arg WEBLAB_VERSION="$HELPER_VERSION" --build-arg WEBLAB_REVISION="$SOURCE_REVISION" \
            -t weblab-internet-sources:ci .
          docker build -f packaging/internet/Dockerfile.release --target release \
            --build-arg WEBLAB_VERSION="$HELPER_VERSION" --build-arg WEBLAB_REVISION="$SOURCE_REVISION" \
            -t "$WL_INTERNET_IMAGE" .
      - name: Test real gateway automation and TCP/UDP publications
        run: |
          sudo apt-get update
          sudo apt-get install -y perl libnet-pcap-perl iproute2 iptables iputils-ping util-linux
          sudo python3 tests/internet_icmp_native.py --run
          docker pull alpine:latest
          docker pull ghcr.io/weblab-network/weblab-frr:10.7.1-wl1
          sudo env WL_INTERNET_IMAGE="$WL_INTERNET_IMAGE" \
            python3 tests/internet_native.py --run --port-forwards-only
      - name: Bundle and verify the tested binary and matching sources
        run: |
          python3 tools/bundle_internet_release.py --image "$WL_INTERNET_IMAGE" \
            --sources-image weblab-internet-sources:ci --output internet-bundle
          python3 tools/verify_internet_bundle.py internet-bundle \
            --version "$HELPER_VERSION" --revision "$SOURCE_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: internet-binary-sources
          path: internet-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [standard, exos-demo, agent, internet]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: internet-binary-sources
          path: internet-bundle
      - name: Verify helper pair for this public release
        run: python3 tools/verify_internet_bundle.py internet-bundle --version "${RELEASE_TAG#v}" --revision "$SOURCE_REVISION"
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s "docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --prerelease --latest=false --title "Weblab ${RELEASE_TAG}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md"
      - name: Publish matching helper sources before its registry image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets
          mkdir -p previous-internet
          sha256sum weblab-install.sh > SHA256SUMS
          for asset in weblab-install.sh SHA256SUMS internet-bundle/weblab-internet-*; do
            name=$(basename "$asset")
            if grep -Fxq "$name" /tmp/release-assets; then
              gh release download "$RELEASE_TAG" --dir previous-internet --pattern "$name"
              cmp "previous-internet/$name" "$asset"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the exact tested helper without rebuilding
        run: |
          docker load -i internet-bundle/weblab-internet-linux-amd64.tar.gz
          image_id=$(python3 -c 'import json; print(json.load(open("internet-bundle/weblab-internet-image.json"))["Id"])')
          image=ghcr.io/${GITHUB_REPOSITORY}-internet
          stage="$image:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$image_id" "$stage"
          docker push "$stage"
          python3 tools/verify_internet_bundle.py internet-bundle \
            --version "${RELEASE_TAG#v}" --revision "$SOURCE_REVISION" --registry-image "$stage"
          digest=$(python3 -c 'import json; print(json.load(open("internet-bundle/weblab-internet-registry.json"))["image"].split("@",1)[1])')
          printf 'HELPER_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Promote all tested images with version and latest guards
        run: |
          python3 tools/promote_release.py --tag "$RELEASE_TAG" --revision "$SOURCE_REVISION" \
            --core '${{ needs.standard.outputs.digest }}' --agent '${{ needs.agent.outputs.digest }}' \
            --exos '${{ needs.exos-demo.outputs.digest }}' --internet "$HELPER_DIGEST" --publish
      - name: Verify the published helper and record its immutable pull reference
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY}-internet:${RELEASE_TAG#v}
          docker pull "$image"
          python3 tools/verify_internet_bundle.py internet-bundle \
            --version "${RELEASE_TAG#v}" --revision "$SOURCE_REVISION" --registry-image "$image"
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq weblab-internet-registry.json; then
            mkdir -p previous-internet
            gh release download "$RELEASE_TAG" --dir previous-internet --pattern weblab-internet-registry.json
            cmp previous-internet/weblab-internet-registry.json internet-bundle/weblab-internet-registry.json
          else
            gh release upload "$RELEASE_TAG" internet-bundle/weblab-internet-registry.json
          fi
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --prerelease=false --latest
