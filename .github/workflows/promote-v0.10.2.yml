name: Publish reviewed Weblab 0.10.2 images

# Promote the already tested immutable image indexes, including attestations.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-weblab-0.10.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'weblab-network/weblab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify reviewed source, full CI and immutable images
        run: python3 tools/promote_v0_10_2.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the tested image aliases
        run: python3 tools/promote_v0_10_2.py --publish
      - name: Publish matching release and installer
        run: |
          mkdir release-assets
          git show v0.10.2:weblab-install.sh > release-assets/weblab-install.sh
          git show v0.10.2:docs/releases/v0.10.2.md > release-assets/RELEASE.md
          cat >> release-assets/RELEASE.md <<'EOF'

          Images were promoted from the successful [full container CI run](https://github.com/weblab-network/weblab/actions/runs/40561905018). All runtime and Docker build inputs match v0.10.2; the tested public commit contains only an additional test-fixture timing fix. The immutable image indexes, SBOMs and attestations are preserved, including their original edge-build metadata. [Reviewed image digests](https://github.com/weblab-network/weblab/blob/main/packaging/releases/v0.10.2.json).
          EOF
          cd release-assets
          sha256sum weblab-install.sh > SHA256SUMS
          gh release create v0.10.2 --verify-tag --latest --title 'Weblab v0.10.2' --notes-file RELEASE.md weblab-install.sh SHA256SUMS
